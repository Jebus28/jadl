name: Refresh JADL site

on:
  schedule:
    # Frequent during US game windows (Sun/Mon/Thu evenings UK time), daily otherwise.
    - cron: "0 */2 * * 0,1,4"
    - cron: "30 7 * * *"
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: jadl-refresh
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Pull the latest from Sleeper
        run: python scripts/fetch_data.py

      - name: Tools for the documents pages
        # PDF covers and the changes between rule editions. The build runs without
        # them, only with neither.
        run: python -m pip install --quiet pypdfium2==5.13.0 pillow==12.3.0

      - name: Build the site
        run: python scripts/build_site.py

      - name: Commit anything that changed
        run: |
          git config user.name "JADL bot"
          git config user.email "actions@github.com"
          git add -A data docs
          if git diff --staged --quiet; then
            echo "Nothing changed."
          else
            git commit -m "Refresh: $(date -u '+%Y-%m-%d %H:%M UTC')"
            git push
          fi
