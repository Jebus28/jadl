name: Refresh JADL site

on:
  schedule:
    # Every quarter of an hour while games are on. Cron runs on UTC, and the UK's
    # late games are the small hours of the next day there, so those windows run to
    # 05:45 UTC: late enough for the night games once the US clocks go back.
    - cron: "*/15 13-23 * * 0"      # Sunday, from the London games to the late window
    - cron: "*/15 0-5 * * 0,1,2,5"  # Sunday, Monday and Thursday night games (and Saturday's in December)
    - cron: "*/15 17-23 * * 4,5,6"  # Thanksgiving, Black Friday and the December Saturdays
    # Once a day otherwise, for trades, waivers and the rest.
    - cron: "30 7 * * *"
    # Wednesday noon UK, when the week's power ranking is fixed. 11:00 UTC while
    # the clocks are forward, 12:00 once they go back; the build only writes the
    # ranking once noon has actually passed, so the early run is a no-op in winter.
    - cron: "0 11,12 * * 3"
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write
  issues: write
  pages: write
  id-token: write

# One refresh at a time, and a new one replaces whatever is running or waiting.
# Every run fetches everything afresh, so nothing is lost. Waiting in line instead
# let one run that GitHub never started block every refresh on 13 September 2026,
# a Sunday, from 04:12 UTC until it was cancelled by hand that evening.
concurrency:
  group: jadl-refresh
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    # A build takes a minute or two. One that hangs must not hold the next up.
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Pull the latest from Sleeper
        run: python scripts/fetch_data.py

      - name: Tools for the documents pages
        # PDF covers and the changes between rule editions. The build runs without
        # them, only with neither.
        run: python -m pip install --quiet pypdfium2==5.13.0 pillow==12.3.0

      - name: Build the site
        env:
          JADL_TODO_FILE: ${{ runner.temp }}/season-todo.md
        run: python scripts/build_site.py

      # The jobs a settled season leaves, as an issue rather than a line in a log
      # nobody reads: opened when there is something outstanding, edited as the
      # list changes, closed by itself once it is empty.
      - name: End-of-season reminders
        # A reminder that will not post must never stop the site refreshing.
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          TODO: ${{ runner.temp }}/season-todo.md
          TITLE: End-of-season jobs
        run: |
          gh label create end-of-season --color B02828 \
            --description "Jobs a settled season leaves the commissioner" --force || true
          open=$(gh issue list --state open --label end-of-season --limit 1 --json number --jq '.[0].number // empty')
          if [ -s "$TODO" ]; then
            printf 'The site cannot do these on its own.\n\n' | cat - "$TODO" > "$TODO.body"
            if [ -n "$open" ]; then
              gh issue edit "$open" --title "$TITLE" --body-file "$TODO.body"
            else
              gh issue create --title "$TITLE" --label end-of-season --body-file "$TODO.body"
            fi
          elif [ -n "$open" ]; then
            gh issue close "$open" --comment "Nothing outstanding - closing."
          fi

      - name: Commit anything that changed
        run: |
          git config user.name "JADL bot"
          git config user.email "actions@github.com"
          git add -A data docs
          # Every build stamps every page with its time, so a build that found
          # nothing new still differs in those stamps. Commit only when something
          # else changed: a changed picture, or a changed line that is not a stamp.
          # Otherwise the history is a commit every quarter of an hour, and every
          # open page reloads for nothing.
          real=$( { git diff --staged --numstat | awk '$1 == "-"'
                    git diff --staged -U0 --no-color \
                      | grep -E '^[+-]' | grep -vE '^(\+\+\+|---) (a/|b/|/dev/null)' \
                      | grep -vE 'Last updated [0-9]|name="jadl-build"|"built": "'
                  } | head -n 1 || true )
          if [ -z "$real" ]; then
            echo "Nothing new."
          else
            git commit -m "Refresh: $(date -u '+%Y-%m-%d %H:%M UTC')"
            # A run cancelled after it pushed can leave this one behind main. This
            # run is the newer, so where the two builds differ, its build wins.
            git push || { git pull --rebase -X theirs origin main && git push; }
          fi
